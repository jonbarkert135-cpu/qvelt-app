# Local development services only. Not a production config.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qvelt
      POSTGRES_PASSWORD: qvelt
      POSTGRES_DB: qvelt
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qvelt
      MINIO_ROOT_PASSWORD: qvelt-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
volumes:
  pgdata:
  miniodata:
